<footer class="site-footer">
  <div class="footer-inner paper">
    <p>&copy; <span id="year"></span> {{ site.name }}. Built with Jekyll.</p>
    <div class="social-links">
      {% if site.social.github and site.social.github != "" %}
        <a href="{{ site.social.github }}" target="_blank" rel="noopener" aria-label="GitHub">GitHub</a>
      {% endif %}
      {% if site.social.linkedin and site.social.linkedin != "" %}
        <a href="{{ site.social.linkedin }}" target="_blank" rel="noopener" aria-label="LinkedIn">LinkedIn</a>
      {% endif %}
      {% if site.social.instagram and site.social.instagram != "" %}
        <a href="{{ site.social.instagram }}" target="_blank" rel="noopener" aria-label="Instagram">Instagram</a>
      {% endif %}
      <a href="mailto:{{ site.email }}" aria-label="Email">Email</a>
    </div>
  </div>
</footer>
