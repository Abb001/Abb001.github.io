{% assign current = page.url %}
<header class="site-header paper" id="siteHeader">
  <div class="header-inner">
    <a href="/" class="logo">{{ site.name | default: "Your Name" }}</a>

    <nav class="main-nav" id="mainNav">
      <a href="/" class="nav-link{% if current == '/' %} active{% endif %}">Home</a>
      <a href="/dev-projects.html" class="nav-link{% if current == '/dev-projects.html' %} active{% endif %}">Dev Projects</a>
      <a href="/fine-art.html" class="nav-link{% if current == '/fine-art.html' %} active{% endif %}">Fine Art</a>
      <a href="/about.html" class="nav-link{% if current == '/about.html' %} active{% endif %}">About &amp; Contact</a>
    </nav>

    <div class="header-actions">
      <button id="themeToggle" class="icon-btn" aria-label="Toggle color theme">
        <span class="icon-sun">☀️</span>
        <span class="icon-moon">🌙</span>
      </button>
      <button id="navToggle" class="icon-btn nav-toggle" aria-label="Toggle menu" aria-expanded="false">
        <span></span><span></span><span></span>
      </button>
    </div>
  </div>
</header>
